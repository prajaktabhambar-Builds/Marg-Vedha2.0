<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nashik 3D Traffic Simulation</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <script src="https://unpkg.com/deck.gl@9.0.12/dist.min.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>
  
  <div class="control-panel">
    <h1>NASHIK TRAFFIC</h1>
    <div class="subtitle">Live 3D Simulation Engine</div>
    
    <div class="controls">
      <div class="control-group">
        <label for="speedSlider">Simulation Speed: <span id="speedValue">5</span>x</label>
        <input type="range" id="speedSlider" min="1" max="20" step="1" value="5">
      </div>
      
      <div class="control-group">
        <label for="opacitySlider">Trail Opacity: <span id="opacityValue">0.8</span></label>
        <input type="range" id="opacitySlider" min="0.1" max="1" step="0.1" value="0.8">
      </div>
      
      <button id="playPauseBtn" class="btn">Pause Simulation</button>
    </div>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-value" id="activeVehicles">0</div>
        <div class="stat-label">Active Vehicles</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="currentTime">00:00</div>
        <div class="stat-label">System Time</div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
